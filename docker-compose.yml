version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: sentinelx_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./sentinelx.db
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-}
      - PAYPAL_MODE=sandbox
      - SECRET_KEY=${SECRET_KEY:-sentinelx_zero_trust_demo_secret}
      - SHADOW_MODE=false
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: sentinelx_web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - api
    restart: unless-stopped

